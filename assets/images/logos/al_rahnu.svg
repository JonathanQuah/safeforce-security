<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <!-- Islamic Gold Crescent and Scales of Justice Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="30" cy="30" r="28" fill="#0B2545" stroke="#C5A059" stroke-width="2"/>
    <!-- Crescent Moon -->
    <path d="M 32 14 A 18 18 0 1 0 32 46 A 14 14 0 1 1 32 14 Z" fill="#D4AF37"/>
    <!-- Scales Beam -->
    <path d="M 18 26 L 42 26" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 20 L 30 40" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <!-- Scale Pans -->
    <path d="M 14 34 L 18 26 L 22 34 Z" fill="#C5A059"/>
    <path d="M 38 34 L 42 26 L 46 34 Z" fill="#C5A059"/>
    <circle cx="30" cy="40" r="3" fill="#D4AF37"/>
  </g>
  <!-- Typography -->
  <text x="85" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#D4AF37" letter-spacing="1.5">AR-RAHNU</text>
  <text x="86" y="55" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="2">ISLAMIC MICRO-FINANCE</text>
</svg>
